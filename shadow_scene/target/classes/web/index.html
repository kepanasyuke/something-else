<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Схема света и тени 30 градусов</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020208; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #88aaff;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="info">🔆 Свет под углом 30° · Сфера 150</div>

    <!-- Подключаем Three.js с CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        // --- Сцена ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);

        // --- Камера (аналогично JavaFX: translateZ = -800) ---
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 800);
        camera.lookAt(0, 0, 0);

        // --- Рендерер ---
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true; // для теней, но мы не используем плоскость
        document.body.appendChild(renderer.domElement);

        // --- Элементы управления (чтобы можно было вращать сцену мышкой) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);

        // --- Освещение ---

        // 1. Ambient light (слабое, цвет #050515 -> примерно 0.02 синего)
        const ambient = new THREE.AmbientLight(0x050515, 1.0);
        scene.add(ambient);

        // 2. Point light (белый, как в JavaFX)
        const light = new THREE.PointLight(0xffffff, 300, 0, 0);
        // угол 30 градусов: как в коде JavaFX: Math.sin(30°) * 500, Math.cos(30°) * -500, Z = -300
        const angle = Math.PI / 6; // 30°
        light.position.set(
            Math.sin(angle) * 500,
            Math.cos(angle) * -500,
            -300
        );
        // Добавляем небольшую вспомогательную сферу, чтобы видеть положение источника (опционально)
        // scene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 16, 16), new THREE.MeshBasicMaterial({color: 0xffaa00})));

        scene.add(light);

        // Можно добавить ещё один направленный свет для чёткости теней, но оставим как есть.

        // --- Объект: сфера (радиус 150) ---
        const geometry = new THREE.SphereGeometry(150, 64, 64);
        // Материал с блеском, чтобы видеть блики
        const material = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            roughness: 0.3,
            metalness: 0.1,
            emissive: 0x000000,
        });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);

        // Добавляем вспомогательные оси (для наглядности, можно закомментировать)
        // const axesHelper = new THREE.AxesHelper(300);
        // scene.add(axesHelper);

        // --- Анимация ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // для OrbitControls
            renderer.render(scene, camera);
        }
        animate();

        // --- Адаптация размера окна ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('Сцена загружена. Свет под углом 30°');
    </script>
</body>
</html>
