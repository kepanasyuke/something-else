<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fluid Materials Lab</title>
    <style>
        :root { color-scheme: dark; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071015; }
        body { font-family: Georgia, serif; }
        canvas { display: block; width: 100%; height: 100%; }
        .control-panel { position: fixed; top: 24px; left: 24px; z-index: 2; width: min(320px, calc(100vw - 48px)); color: #edf6f0; }
        h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 42px); font-weight: 400; letter-spacing: 0; }
        p { margin: 0 0 18px; color: #a8c2bc; font: 14px/1.5 system-ui, sans-serif; }
        .modes { display: flex; gap: 6px; flex-wrap: wrap; }
        button { border: 1px solid #51716a; border-radius: 4px; padding: 9px 13px; background: #10241f; color: #d7e9e3; cursor: pointer; font: 13px system-ui, sans-serif; }
        button[aria-pressed="true"] { background: #b9e7c5; color: #10241f; border-color: #b9e7c5; }
    </style>
</head>
<body>
    <section class="control-panel" aria-label="Выбор материала">
        <h1>Fluid Materials</h1>
        <p>Нажмите и удерживайте в сцене, чтобы возмутить поверхность.</p>
        <div class="modes">
            <button type="button" data-material="helium" aria-pressed="true">Гелий</button>
            <button type="button" data-material="water" aria-pressed="false">Вода</button>
            <button type="button" data-material="gas" aria-pressed="false">Газ</button>
        </div>
    </section>
    <canvas id="fluidCanvas" aria-label="Интерактивная сцена материалов"></canvas>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
